name: Build and publish Jewhub APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Verify build secrets
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.JEWHUB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JEWHUB_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JEWHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JEWHUB_KEY_PASSWORD }}
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Add SOURCE_REPO_TOKEN with read access to Fred-Systems/Jewhub in this repository's Actions secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add JEWHUB_KEYSTORE_BASE64, JEWHUB_STORE_PASSWORD, JEWHUB_KEY_ALIAS, and JEWHUB_KEY_PASSWORD. The matching signing key is required for in-place app updates."
            exit 1
          fi

      - name: Check out Jewhub source
        uses: actions/checkout@v4
        with:
          repository: Fred-Systems/Jewhub
          ref: main
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: source/gradle/libs.versions.toml

      - name: Configure existing release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JEWHUB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JEWHUB_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JEWHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JEWHUB_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set JEWHUB_KEYSTORE_BASE64, JEWHUB_STORE_PASSWORD, JEWHUB_KEY_ALIAS, and JEWHUB_KEY_PASSWORD in this release repository's Actions secrets. Publishing a differently signed APK would prevent in-place updates."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > source/keystore.jks
          cat > source/keystore.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare release asset
        run: |
          test -f source/app/build/outputs/apk/release/app-release.apk
          cp source/app/build/outputs/apk/release/app-release.apk Jewhub-v1.10.19.apk
          sha256sum Jewhub-v1.10.19.apk

      - name: Publish v1.10.19 to this release repository only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.19
          target_commitish: ${{ github.sha }}
          name: Jewhub v1.10.19
          body: |
            Jewhub v1.10.19

            Includes chronological status playback and hold-to-pause, NexText Lite download access, and per-user Jewhub usage limits and restriction controls.
          files: Jewhub-v1.10.19.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
